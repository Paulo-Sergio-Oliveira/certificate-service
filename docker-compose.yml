services:
  postgres:
    image: postgres:16-alpine
    container_name: certificates-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: certificates_db
    volumes:
      - certificates_pgdata:/var/lib/postgresql/data

volumes:
  certificates_pgdata: